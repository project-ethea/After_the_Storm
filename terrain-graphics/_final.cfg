# wmllint: no translatables

# Starfield or some crap
{NEW:BASE                 Xzsf                 chasm/abyss                }

# Cracks
{NEW:OVERLAY              *^Egk                ../scenery/ground-crack         }

# Statues
{NEW:OVERLAY              *^Ezx                ../scenery/statue-xiael         }

# Dry grassland elvish castle
{NEW:BASE                Cvz                   elvish-castle-ground-dry}
{NEW:CASTLEWALL          Cvz                   (!,C*,K*,Xu*,Xo*)          !,Ket,!,C*,Ke*    castle/elven/castle}

# Dry grassland elvish castle ruins
{NEW:BASE                Cvrz                  elvish-castle-ground-dry}
{NEW:CASTLEWALL          Cvrz                  (!,C*,K*,Xu*,Xo*)          !,Ket,!,C*,Ke*    castle/elven-ruin/castle}

# Fake fog
{FOG_SIMPLE               *^Zow           LAYER=1                }
{NEW:TRANSITION           *^Zow (!,*^Zow) 1 fog/fog FLAG=overlay }
